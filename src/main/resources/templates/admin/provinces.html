<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Lumina | Province Management</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
  <style>
    body { background-color: #f8f9fa; }
    .sidebar { height: 100vh; background-color: #87CEEB; color: white; position: fixed; width: 250px; padding-top: 20px; }
    .sidebar a { color: white; text-decoration: none; padding: 10px 20px; display: block; transition: 0.3s; }
    .sidebar a:hover { background-color: #00BFFF; }
    .main-content { margin-left: 250px; padding: 50px; }
    .bg-sky { background-color: #87CEEB !important; color: white !important; }

    /* Make icons slightly larger and center them */
    .btn-sm i {
        font-size: 0.9rem;
        vertical-align: middle;
    }

    /* Add a tooltip-like feel */
    .btn-outline-primary:hover {
        background-color: #87CEEB; /* Lumina Sky Blue */
        border-color: #87CEEB;
    }

    #provinceSearch:focus {
        border-color: #00BFFF;
        box-shadow: 0 0 0 0.2rem rgba(135, 206, 235, 0.25);
    }

    .fa-exclamation-triangle {
        animation: blinker 1.5s linear infinite;
    }

    @keyframes blinker {
        50% { opacity: 0.5; }
    }
  </style>
</head>
<body>

<div class="sidebar shadow">
  <div class="d-flex align-items-center justify-content-center">
    <img src="/images/lumina-logo.png"
         class="rounded-circle"
         style="width: 70px; height: 70px; object-fit: cover;">
    <h4 class="ms-1 mb-0 text-white fw-bold">Lumina</h4>
  </div>

  <hr class="mx-3 text-white">

  <div class="mt-3">
    <a th:href="@{/admin/provinces}" class="fw-bold bg-white text-dark shadow-sm">Provinces</a>
    <a th:href="@{/admin/cities}">Cities</a>
    <a th:href="@{/admin/case-types}">Case Types</a>
    <a href="#">Crime Records</a>
    <a href="#">Analysis</a>
  </div>
</div>

<div class="main-content">
  <div class="card shadow-sm border-0">
    <div class="card-header bg-sky d-flex justify-content-between align-items-center p-3">
      <h5 class="mb-0">Province Management</h5>

      <div class="d-flex align-items-center">
        <div class="input-group input-group-sm me-3" style="width: 250px;">
            <span class="input-group-text bg-white border-end-0">
                <i class="fas fa-search text-muted"></i>
            </span>
          <input type="text" id="provinceSearch" onkeyup="filterProvinces()" class="form-control" placeholder="Search...">
        </div>

        <button class="btn btn-light btn-sm" onclick="prepareAdd()">
          <i class="fas fa-plus me-1"></i> Add New
        </button>
      </div>
    </div>
    <div class="card-body">
      <table class="table table-hover">
        <thead>
        <tr>
          <th>Province Name</th>
          <th class="text-end">Actions</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="p : ${provinces}">
          <td th:text="${p.province_en}"></td>
          <td class="text-end">
            <button class="btn btn-outline-primary btn-sm me-2"
                    th:data-id="${p.province_id}"
                    th:data-name="${p.province_en}"
                    onclick="editProvince(this.getAttribute('data-id'), this.getAttribute('data-name'))"
                    title="Edit">
              <i class="fas fa-pencil-alt"></i>
            </button>

            <button class="btn btn-outline-danger btn-sm"
                    th:data-id="${p.province_id}"
                    th:data-name="${p.province_en}"
                    onclick="prepareDelete(this.getAttribute('data-id'), this.getAttribute('data-name'))"
                    title="Delete">
              <i class="fas fa-trash-can"></i>
            </button>
          </td>
        </tr>
        </tbody>
      </table>
    </div>
  </div>
</div>

<div class="modal fade" id="addModal" tabindex="-1">
  <div class="modal-dialog">
    <form th:action="@{/admin/provinces/save}" method="post" class="modal-content">
      <div class="modal-header bg-sky text-white">
        <h5 class="modal-title" id="modalTitle">Province Details</h5>
        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <input type="hidden" name="province_id" id="province_id">
        <div class="mb-3">
          <label class="form-label">Province Name</label>
          <input type="text" name="province_en" id="province_en" class="form-control" required>
        </div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
        <button type="submit" class="btn bg-sky">Save Changes</button>
      </div>
    </form>
  </div>
</div>

<div class="modal fade" id="deleteModal" tabindex="-1">
  <div class="modal-dialog"> <div class="modal-content border-0 shadow">
    <div class="modal-header bg-danger text-white">
      <h5 class="modal-title">Confirm Deletion</h5>
      <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
    </div>

    <div class="modal-body py-4">
      <div class="d-flex align-items-center">
        <div class="flex-shrink-0">
          <i class="fas fa-exclamation-triangle fa-3x text-danger"></i>
        </div>
        <div class="flex-grow-1 ms-3">
          <p class="mb-1">You are deleting:</p>
          <h5 class="text-dark fw-bold" id="deleteProvinceNameDisplay"></h5>
        </div>
      </div>
    </div>

    <div class="modal-footer bg-light">
      <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
      <a id="confirmDeleteBtn" href="#" class="btn btn-danger">Confirm Delete</a>
    </div>
  </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
  const provinceModal = new bootstrap.Modal(document.getElementById('addModal'));

  function prepareAdd() {
      document.getElementById('province_id').value = '';
      document.getElementById('province_en').value = '';
      document.getElementById('modalTitle').innerText = 'Add New Province';
      provinceModal.show();
  }

  function editProvince(id, name) {
      document.getElementById('province_id').value = id;
      document.getElementById('province_en').value = name;
      document.getElementById('modalTitle').innerText = 'Edit Province';
      provinceModal.show();
  }

  function filterProvinces() {
    const input = document.getElementById("provinceSearch");
    const filter = input.value.toLowerCase();
    const tbody = document.querySelector("table tbody");
    const rows = tbody.getElementsByTagName("tr");

    for (let i = 0; i < rows.length; i++) {
        // This version searches ALL cells in the row,
        // so it doesn't matter which column the name is in!
        const cells = rows[i].getElementsByTagName("td");
        let found = false;

        for (let j = 0; j < cells.length; j++) {
            const cellText = cells[j].textContent || cells[j].innerText;
            if (cellText.toLowerCase().indexOf(filter) > -1) {
                found = true;
                break;
            }
        }

        if (found) {
            rows[i].style.display = "";
        } else {
            rows[i].style.display = "none";
        }
    }
}

const deleteModal = new bootstrap.Modal(document.getElementById('deleteModal'));

function prepareDelete(id, name) {
    // 1. Display the name in the new bold header format
    document.getElementById('deleteProvinceNameDisplay').innerText = name;

    // 2. Map the URL
    const deleteUrl = '/admin/provinces/delete/' + id;
    document.getElementById('confirmDeleteBtn').setAttribute('href', deleteUrl);

    // 3. Show modal
    deleteModal.show();
}
</script>
</body>
</html>
