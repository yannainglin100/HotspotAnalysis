<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Lumina | Case Type Management</title>
  <link rel="icon" type="image/png" href="/images/lumina-logo.png">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
  <style>
    body { background-color: #f8f9fa; }
    .sidebar { height: 100vh; background-color: #87CEEB; color: white; position: fixed; width: 250px; padding-top: 20px; }
    .sidebar a { color: white; text-decoration: none; padding: 10px 20px; display: block; transition: 0.3s; }
    .sidebar a:hover { background-color: #00BFFF; }
    .main-content { margin-left: 250px; padding: 50px; }
    .bg-sky { background-color: #87CEEB !important; color: white !important; }
    .btn-sm i { font-size: 0.9rem; vertical-align: middle; }
    #caseSearch:focus { border-color: #00BFFF; box-shadow: 0 0 0 0.2rem rgba(135, 206, 235, 0.25); }
    .fa-exclamation-triangle { animation: blinker 1.5s linear infinite; }
    @keyframes blinker { 50% { opacity: 0.5; } }

    .sidebar {
    background-color: #87CEEB; /* bg-sky */
    width: 260px;
    position: fixed;
    height: 100%;
    z-index: 1000;
}

.nav-link-custom {
    display: flex;
    align-items: center;
    padding: 12px 20px;
    color: white;
    text-decoration: none;
    font-weight: 500;
    transition: all 0.3s;
}

.nav-link-custom i {
    width: 25px; /* Fixed width for icons ensures text aligns vertically */
    margin-right: 15px;
    font-size: 1.1rem;
}

.nav-link-custom:hover {
    background: rgba(255, 255, 255, 0.2);
    color: white;
}

/* Style for active page (can be applied via Thymeleaf classappend) */
.nav-link-custom.active {
    background: white;
    color: #333;
    font-weight: bold;
    box-shadow: 0 4px 6px rgba(0,0,0,0.1);
}
  </style>
</head>
<body>

<div class="sidebar shadow d-flex flex-column" style="min-height: 100vh;">
  <div class="d-flex align-items-center justify-content-center pt-4">
    <img src="/images/lumina-logo.png" class="rounded-circle" style="width: 60px; height: 60px; object-fit: cover; border: 2px solid white;">
    <h4 class="ms-2 mb-0 text-white fw-bold">Lumina</h4>
  </div>

  <hr class="mx-3 text-white">

  <div class="mt-2 flex-grow-1">
    <a th:href="@{/admin/provinces}" class="nav-link-custom">
      <i class="fas fa-map-marked-alt"></i> Provinces
    </a>
    <a th:href="@{/admin/cities}" class="nav-link-custom">
      <i class="fas fa-city"></i> Cities
    </a>
    <a th:href="@{/admin/case-types}" class="nav-link-custom fw-bold bg-white text-dark shadow-sm">
      <i class="fas fa-layer-group"></i> Case Types
    </a>
    <a th:href="@{/admin/incidents}" class="nav-link-custom">
      <i class="fas fa-file-invoice"></i> Crime Records
    </a>
    <a th:href="@{/admin/analysis}" class="nav-link-custom">
      <i class="fas fa-chart-line"></i> Hotspot Analysis
    </a>
    <a th:href="@{/admin/models}" class="nav-link-custom">
      <i class="fas fa-microchip"></i> Models
    </a>
  </div>

  <div class="mt-auto mb-4 px-3">
    <hr class="text-white opacity-50">
    <a th:href="@{/logout}" class="btn btn-danger w-100 d-flex align-items-center justify-content-center">
      <i class="fas fa-sign-out-alt me-2"></i> Logout
    </a>
  </div>
</div>

<div class="main-content">
  <div class="card shadow-sm border-0">
    <div class="card-header bg-sky d-flex justify-content-between align-items-center p-3">
      <h5 class="mb-0"><i class="fas fa-layer-group me-2"></i> Case Type Management</h5>
      <div class="d-flex align-items-center">
        <div class="input-group input-group-sm me-3" style="width: 250px;">
          <span class="input-group-text bg-white border-end-0"><i class="fas fa-search text-muted"></i></span>
          <input type="text" id="caseSearch" onkeyup="filterCases()" class="form-control" placeholder="Search...">
        </div>
        <button class="btn btn-light btn-sm" onclick="prepareAdd()"><i class="fas fa-plus me-1"></i> Add New</button>
      </div>
    </div>
    <div class="card-body">
      <table class="table table-hover">
        <thead>
        <tr>
          <th>Case Name</th>
          <th>Weight</th>
          <th class="text-end">Actions</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="c : ${caseTypes}">
          <td th:text="${c.case_type_en}"></td>
          <td>
            <span class="badge"
                  th:classappend="${c.weight == 4 ? 'bg-danger' :
                                   c.weight == 3 ? 'bg-warning text-dark' :
                                   c.weight == 2 ? 'bg-info text-dark' : 'bg-secondary'}"
                  th:text="${c.weight}">
            </span>
          </td>
          <td class="text-end">
            <button class="btn btn-outline-primary btn-sm me-2"
                    th:data-id="${c.case_type_id}"
                    th:data-name="${c.case_type_en}"
                    th:data-weight="${c.weight}"
                    onclick="editCase(this.getAttribute('data-id'), this.getAttribute('data-name'), this.getAttribute('data-weight'))">
              <i class="fas fa-pencil-alt"></i>
            </button>
            <button class="btn btn-outline-danger btn-sm"
                    th:data-id="${c.case_type_id}" th:data-name="${c.case_type_en}"
                    onclick="prepareDelete(this.getAttribute('data-id'), this.getAttribute('data-name'))">
              <i class="fas fa-trash-can"></i>
            </button>
          </td>
        </tr>
        </tbody>
      </table>
    </div>
  </div>
</div>

<div class="modal fade" id="caseModal" tabindex="-1">
  <div class="modal-dialog">
    <form th:action="@{/admin/case-types/save}" method="post" class="modal-content">
      <div class="modal-header bg-sky text-white">
        <h5 class="modal-title" id="modalTitle">Case Type Details</h5>
        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <input type="hidden" name="case_type_id" id="case_type_id">
        <div class="mb-3">
          <label class="form-label">Case Name</label>
          <input type="text" name="case_type_en" id="case_type_en" class="form-control" required>
        </div>
        <div class="mb-3">
          <label class="form-label">Weight (Severity)</label>
          <select name="weight" id="weight" class="form-control" required>
            <option value="" disabled selected>Select Severity Level</option>
            <option value="1">1 (For Financial/Non-violent Crime)</option>
            <option value="2">2 (For Property/Threat Crime)</option>
            <option value="3">3 (For Weapons/Violence Crime)</option>
            <option value="4">4 (For Life/Trauma Crime)</option>
          </select>
        </div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
        <button type="submit" class="btn bg-sky">Save Changes</button>
      </div>
    </form>
  </div>
</div>

<div class="modal fade" id="deleteModal" tabindex="-1">
  <div class="modal-dialog">
    <div class="modal-content border-0 shadow">
      <div class="modal-header bg-danger text-white">
        <h5 class="modal-title">Confirm Deletion</h5>
        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body py-4">
        <div class="d-flex align-items-center">
          <i class="fas fa-exclamation-triangle fa-3x text-danger"></i>
          <div class="ms-3">
            <p class="mb-1">You are deleting:</p>
            <h5 class="text-dark fw-bold" id="delNameDisplay"></h5>
          </div>
        </div>
      </div>
      <div class="modal-footer bg-light">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
        <a id="confirmDelBtn" href="#" class="btn btn-danger">Confirm Delete</a>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
  const cModal = new bootstrap.Modal(document.getElementById('caseModal'));
  const dModal = new bootstrap.Modal(document.getElementById('deleteModal'));

  function prepareAdd() {
    document.getElementById('case_type_id').value = '';
    document.getElementById('case_type_en').value = '';
    document.getElementById('weight').value = '';
    document.getElementById('modalTitle').innerText = 'Add New Case Type';
    cModal.show();
  }

  function editCase(id, name, weight) {
    document.getElementById('case_type_id').value = id;
    document.getElementById('case_type_en').value = name;
    document.getElementById('weight').value = weight === 'null' ? '' : weight;
    document.getElementById('modalTitle').innerText = 'Edit Case Type';
    cModal.show();
  }

  function prepareDelete(id, name) {
    document.getElementById('delNameDisplay').innerText = name;
    document.getElementById('confirmDelBtn').setAttribute('href', '/admin/case-types/delete/' + id);
    dModal.show();
  }

  function filterCases() {
    let input = document.getElementById("caseSearch").value.toLowerCase();
    let rows = document.querySelectorAll("table tbody tr");
    rows.forEach(row => {
      row.style.display = row.innerText.toLowerCase().includes(input) ? "" : "none";
    });
  }

  function editCase(id, name, weight) {
    document.getElementById('case_type_id').value = id;
    document.getElementById('case_type_en').value = name;

    // Set the dropdown value. If null/empty, defaults to the first option.
    const weightSelect = document.getElementById('weight');
    weightSelect.value = (weight === 'null' || weight === '') ? "" : weight;

    document.getElementById('modalTitle').innerText = 'Edit Case Type';
    cModal.show();
}
</script>
</body>
</html>
