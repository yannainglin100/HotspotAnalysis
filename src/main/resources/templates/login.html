<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <title>Lumina | Admin Login</title>
  <link rel="icon" type="image/png" href="/images/lumina-logo.png">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
  <style>
    body {
        background-color: #87CEEB; /* bg-sky */
        height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    .login-card {
        background: rgba(255, 255, 255, 0.9);
        backdrop-filter: blur(10px);
        border-radius: 20px;
        box-shadow: 0 15px 35px rgba(0,0,0,0.1);
        width: 100%;
        max-width: 400px;
        padding: 2.5rem;
        border: 1px solid rgba(255, 255, 255, 0.3);
    }
    .logo-container {
        margin-bottom: 1.5rem;
        text-align: center;
    }
    .system-name {
        color: #0d6efd; /* Adjust color to contrast with bg-sky if needed */
        letter-spacing: 1px;
    }
    .btn-login {
        background-color: #00aaff;
        border: none;
        padding: 0.75rem;
        font-weight: bold;
        transition: all 0.3s ease;
    }
    .btn-login:hover {
        background-color: #0088cc;
        transform: translateY(-2px);
    }
    .input-group-text {
        background: transparent;
        border-right: none;
    }
    .form-control {
        border-left: none;
    }
    .form-control:focus {
        box-shadow: none;
        border-color: #dee2e6;
    }
  </style>
</head>
<body>

<div class="login-card animate__animated animate__fadeIn">
  <div class="logo-container">
    <img src="/images/lumina-logo.png" class="rounded-circle shadow-sm mb-2"
         style="width: 80px; height: 80px; object-fit: cover; border: 3px solid white;">
    <h2 class="fw-bold system-name">Lumina</h2>
    <p class="text-muted small">Hotspot Analysis System</p>
  </div>

  <div th:if="${error}" class="alert alert-danger py-2 small text-center" role="alert">
    <i class="fas fa-exclamation-circle me-2"></i>[[${error}]]
  </div>

  <form th:action="@{/login}" method="post">
    <div class="mb-3">
      <label class="form-label small fw-bold text-secondary">Username</label>
      <div class="input-group">
        <span class="input-group-text text-muted"><i class="fas fa-user"></i></span>
        <input type="text" name="username" class="form-control" placeholder="Enter username" required>
      </div>
    </div>

    <div class="mb-4">
      <label class="form-label small fw-bold text-secondary">Password</label>
      <div class="input-group">
        <span class="input-group-text text-muted"><i class="fas fa-lock"></i></span>
        <input type="password" name="password" class="form-control" placeholder="Enter password" required>
      </div>
    </div>

    <button type="submit" class="btn btn-primary btn-login w-100 text-white rounded-pill">
      LOGIN <i class="fas fa-sign-in-alt ms-2"></i>
    </button>
  </form>
</div>

</body>
</html>
